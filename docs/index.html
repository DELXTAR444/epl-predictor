<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>EPL ทายสกอร์</title>
<style>
:root{--bg:#0a1030;--card:#111a40;--bd:#243066;--fg:#f1f3ff;--mut:#9aa6d6;--ac:#5b5cf0;--g:#16c46a;--r:#f0364f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1c2a78 0,var(--bg) 60%) fixed;color:var(--fg);font-family:system-ui,"Noto Sans Thai",sans-serif}
#shell{display:grid;grid-template-columns:1fr;gap:16px;padding:14px 14px 84px;max-width:1280px;margin:auto}
#side{display:none}
@media(min-width:980px){#shell{grid-template-columns:220px 1fr 320px;padding:20px}#side{display:block}#bnav{display:none!important}}
.brand{font-weight:800;font-size:18px;margin-bottom:18px}.brand small{display:block;font-weight:400;color:var(--mut);font-size:12px}
#side button{display:flex;gap:10px;width:100%;padding:12px;margin-bottom:6px;border:0;border-radius:10px;background:none;color:var(--fg);font-size:15px;text-align:left;cursor:pointer}
#side button.on{background:var(--ac)}
#bnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0)}
#bnav button{flex:1;border:0;background:none;color:var(--mut);padding:12px 0;font-size:13px}#bnav button.on{color:#fff;font-weight:700}
.hero{border:1px solid var(--bd);border-radius:16px;padding:18px;background:linear-gradient(120deg,#1b2a8a,#0e1650)}
.hero h1{margin:0 0 6px;font-size:24px}.m{color:var(--mut);font-size:12.5px;line-height:1.6}
h2{font-size:17px;margin:20px 0 10px;display:flex;justify-content:space-between;align-items:center}
.pill{font-size:12px;font-weight:400;background:#1b2559;border:1px solid var(--bd);border-radius:8px;padding:5px 10px;color:var(--mut)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.dchip{display:inline-block;background:var(--ac);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;min-width:0}.tm.r{flex-direction:row-reverse;text-align:right}
.bd{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;border:2px solid #ffffff30}
.sc{background:#0b1237;border:1px solid var(--bd);border-radius:10px;padding:8px 14px;font-size:24px;font-weight:800;text-align:center;min-width:86px}.sc small{display:block;font-size:14px;line-height:1.2}
.bar{display:flex;height:8px;border-radius:6px;overflow:hidden;margin:12px 0 5px}.lg{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.k{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}.k:last-child{border:0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;text-align:center;border-bottom:1px solid var(--bd)}td:nth-child(2),th:nth-child(2){text-align:left}
.tm2{display:flex;align-items:center;gap:8px}.tm2 .bd{width:26px;height:26px;font-size:9px}
label{font-size:13px;color:var(--mut)}
</style></head><body>
<div id="shell"><aside id="side"></aside><main id="main"><div class="m">กำลังโหลด…</div></main><section id="right"></section></div>
<nav id="bnav"></nav>
<script>
let D,tab='home',inj=true;const $=s=>document.querySelector(s);
const nm=t=>t.replace(/ (AFC|FC)$/,'').replace(/^AFC /,'');const pct=x=>Math.round(x*100)+'%';
const TC={arsenal:['ARS','#e03a3e'],'aston villa':['AVL','#8a2a4f'],bournemouth:['BOU','#c8102e'],brentford:['BRE','#e30613'],'brighton & hove albion':['BHA','#0057b8'],burnley:['BUR','#7a263a'],chelsea:['CHE','#034694'],'crystal palace':['CRY','#1b458f'],everton:['EVE','#003399'],fulham:['FUL','#555'],'leeds united':['LEE','#1d428a'],liverpool:['LIV','#c8102e'],'manchester city':['MCI','#4d8fc7'],'manchester united':['MUN','#da291c'],'newcastle united':['NEW','#444'],'nottingham forest':['NFO','#dd0000'],'tottenham hotspur':['TOT','#3a4a8a'],'west ham united':['WHU','#7a263a'],'wolverhampton wanderers':['WOL','#b8860b'],sunderland:['SUN','#d71920'],'coventry city':['COV','#3d8bc4'],'ipswich town':['IPS','#0b4ea2']};
function badge(t){const k=nm(t).toLowerCase();const h=[...k].reduce((a,x)=>(a*31+x.charCodeAt(0))%360,7);const[c,col]=TC[k]||[nm(t).slice(0,3).toUpperCase(),`hsl(${h},45%,38%)`];return`<span class="bd" style="background:${col}">${c}</span>`}
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TZ={timeZone:'Asia/Bangkok'};
const dayKey=f=>f[3]?new Date(f[3]).toLocaleDateString('en-CA',TZ):f[0];
const dayTxt=f=>(f[3]?new Date(f[3]):new Date(f[0]+'T12:00:00Z')).toLocaleDateString('th-TH',{...TZ,weekday:'long',day:'numeric',month:'short'});
const timeTxt=f=>f[3]?new Date(f[3]).toLocaleTimeString('th-TH',{...TZ,hour:'2-digit',minute:'2-digit'})+' น.':'';
const ij=t=>{const i=D.inj[t];return i&&i.players.length?`<div class="m">🤕 ${nm(t)}: ${i.players.slice(0,3).map(x=>esc(x.n)).join(', ')}</div>`:''};
const nws=t=>{const n=(D.news||{})[t];if(!n||!n.length)return'';const x=n[0];return`<div class="m">📰 ${esc(nm(t))}: <a style="color:#a5b4fc" href="${/^https?:/.test(x.l)?esc(x.l):'#'}" target="_blank" rel="noopener">${esc(x.t)}</a> ${x.s<0?'🔴':'🟢'}</div>`};
function card(f){const[,h,a]=f,P=f[4],p=(inj&&P.i)?P.i:P.b,star=Math.max(p.w,p.d,p.l)>=.55?'<small>⭐</small>':'';
 const uk=f[3]?new Date(f[3]).toLocaleString('th-TH',{timeZone:'Europe/London',weekday:'short',hour:'2-digit',minute:'2-digit'}):'';
 return`<div class="c"><span class="dchip">${dayTxt(f)}${timeTxt(f)?' · '+timeTxt(f):''}</span>${uk?` <span class="m">(เวลาอังกฤษ ${uk})</span>`:''}
 <div class="row"><div class="tm">${badge(h)}<span>${nm(h)}</span></div><div class="sc">${star}${p.s[0]} - ${p.s[1]}</div><div class="tm r">${badge(a)}<span>${nm(a)}</span></div></div>
 <div class="bar"><div style="width:${p.w*100}%;background:var(--g)"></div><div style="width:${p.d*100}%;background:#5a6bb5"></div><div style="width:${p.l*100}%;background:var(--r)"></div></div>
 <div class="lg"><span>เหย้า ${pct(p.w)}</span><span>เสมอ ${pct(p.d)}</span><span>เยือน ${pct(p.l)}</span></div>
 <div class="m" style="margin-top:8px">ทาย: <b>${pt[p.k]}</b> · สกอร์ตรงกลางคือสกอร์ที่น่าจะเป็นที่สุดของผลนี้</div>
 <div class="m">สกอร์ที่มีโอกาสสูงสุดทีละสกอร์: ${p.t3.map(c=>`${c[0]}-${c[1]} (${pct(c[2])})`).join(' · ')}</div>
 <div class="m">สูงกว่า 2.5 ประตู ${pct(p.o)} · ทั้งคู่ได้ประตู ${pct(p.bt)} · ประตูคาด ${p.lh.toFixed(1)}-${p.la.toFixed(1)}</div>
 ${p.mk?`<div class="m">เจ้ามือให้: เหย้า ${pct(p.mk[0])} · เสมอ ${pct(p.mk[1])} · เยือน ${pct(p.mk[2])}</div>`:''}
 ${inj&&D.inj_ok?ij(h)+ij(a):''}${nws(h)}${nws(a)}</div>`}
const F=()=>[...D.fx].sort((x,y)=>(x[3]||x[0]).localeCompare(y[3]||y[0]));
const toggle=()=>D.inj_ok?`<label><input type="checkbox" ${inj?'checked':''} onchange="inj=this.checked;render()"> ปรับตามตัวเจ็บ</label>`:'<span class="m">⚠️ ยังไม่ได้ข้อมูลตัวเจ็บ ใช้สถิติล้วน</span>';
const legend='<div class="m">⭐ = โมเดลมั่นใจ (ผลใดผลหนึ่งมีโอกาสเกิน 55%) · ทายล่วงหน้าเฉพาะสัปดาห์นี้ เพราะข่าวเปลี่ยนได้ตลอด</div>';
function home(){const L=F();if(!L.length)return'<div class="c">ยังไม่มีแมตช์ในสัปดาห์นี้</div>';const k0=dayKey(L[0]),t=L.filter(f=>dayKey(f)===k0);
 return`<div class="hero"><h1>⚽ EPL ทายสกอร์</h1><div class="m">ข้อมูล ${D.n} นัด (${D.seasons.length} ฤดูกาล) · ผลล่าสุด ${D.last}</div></div>
 <h2>แมตช์ถัดไป: ${dayTxt(t[0])}<span class="pill">สัปดาห์นี้อีก ${L.length} แมตช์</span></h2>${toggle()}${legend}<div style="height:10px"></div>${t.map(card).join('')}
 <button class="pill" style="cursor:pointer" onclick="go('fx')">ดูโปรแกรมทั้งสัปดาห์ ›</button>`}
function fxTab(){const L=F();let last='',o=`<h2>โปรแกรมสัปดาห์นี้</h2>${toggle()}${legend}<div style="height:10px"></div>`;
 if(!L.length)return o+'<div class="c">ยังไม่มีแมตช์ในสัปดาห์นี้</div>';
 for(const f of L){const k=dayKey(f);if(k!==last){last=k;o+=`<h2 style="font-size:14px;color:var(--mut)">${dayTxt(f)}</h2>`}o+=card(f)}return o}
function tbl(n){const T=n?D.table.slice(0,n):D.table;return`<table><tr><th>#</th><th>ทีม</th><th>แข่ง</th>${n?'':'<th>ชนะ</th><th>เสมอ</th><th>แพ้</th><th>ได้</th><th>เสีย</th><th>ต่าง</th>'}<th>แต้ม</th></tr>`+T.map((r,i)=>`<tr><td>${i+1}</td><td><div class="tm2">${badge(r[0])}${nm(r[0])}</div></td><td>${r[1]}</td>${n?'':`<td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td><td>${r[7]}</td>`}<td><b>${r[8]}</b></td></tr>`).join('')+'</table>'}
const pt={H:'เจ้าบ้านชนะ',D:'เสมอ',A:'เยือนชนะ'};
const BM=()=>D.bt.tb.full;
const nmk=k=>k==0?'โมเดลเรา 100%':k==1?'เจ้ามือ 100%':'เจ้ามือ '+Math.round(k*100)+'%';
function blendBox(){const B=D.bt,ks=Object.keys(B.blend||{}).sort((a,b)=>a-b);
 if(!ks.length)return`<div class="c"><b>ราคาเจ้ามือ</b><div class="m">${B.odds_tested?'ข้อมูลราคาไม่พอให้ทดสอบ':'ยังดึงราคาเจ้ามือจาก football-data.co.uk ไม่ได้ ระบบใช้โมเดลของเราล้วน'}</div></div>`;
 return`<div class="c"><b>ผสมราคาเจ้ามือ</b><div class="m">ทดสอบ ${B.blend[ks[0]].n} นัดที่มีราคา · ระบบเลือก (สูงสุด 75%): <b>${nmk(B.P.lam)}</b></div><div style="overflow-x:auto"><table><tr><th style="text-align:left">สัดส่วน</th><th>ผลถูก</th><th>เป๊ะ</th><th>Top-3</th><th>log</th></tr>${ks.map(k=>{const v=B.blend[k];return`<tr style="${+k===B.P.lam?'color:#a5b4fc;font-weight:700':''}"><td style="text-align:left">${nmk(+k)}</td><td>${v.acc}%</td><td>${v.ex}%</td><td>${v.t3}%</td><td>${v.ll}</td></tr>`}).join('')}</table></div><div class="m" style="margin-top:6px">ราคาในอดีตเป็นราคาใกล้เวลาเตะ ราคาที่ใช้ทายล่วงหน้าอาจออกก่อนหลายวันจึงอาจแม่นน้อยกว่าตัวเลขนี้</div></div>`}
function setBox(){const B=D.bt,P=B.P,no='ไม่ใช้ (ทดสอบแล้วไม่ช่วย)',yn=v=>v?'ใช้':no;
 const R=[['ครึ่งชีวิตของข้อมูล (จูนเอง)',P.hl+' วัน'],['ถ่วงด้วยสถิติยิงประตู/ยิงตรงกรอบ',P.g?Math.round(P.g*100)+'%':(B.shots_tested?no:'ยังไม่มีข้อมูลยิง')],['ตัวแก้ Dixon-Coles',yn(P.dc)],['ค่าเจ้าบ้านรายทีม',yn(P.hf)],['ปรับตามวันพัก',P.rc?'ใช้ ('+P.rc+')':no],['ผสมโมเดล Elo',P.eps?Math.round(P.eps*100)+'%':no],['ผสมราคาเจ้ามือ',P.lam?Math.round(P.lam*100)+'%':(B.odds_tested?no:'ยังไม่มีราคา')],['ค่าถ่วงตัวเจ็บ',D.coef+(D.ncoef>=40?' (จูนจาก '+D.ncoef+' นัด)':' (ค่าตั้งต้น รอผลถึง 40 นัด)')],['ข่าวจาก RSS','แสดงอย่างเดียว ไม่ปรับสกอร์']];
 return`<div class="c"><b>ระบบเลือกใช้อะไรบ้าง</b><div class="m">ทุกตัวเลือกต้องชนะ backtest ชัดเจนถึงจะถูกใช้ ถ้าไม่ช่วยจะถูกปิดเอง</div>${R.map(r=>`<div class="k"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`}
function accTab(){const a=D.acc,B=D.bt,T=B.tb;
 const rows=[['ผลแพ้/เสมอ/ชนะถูก','acc','%'],['สกอร์เป๊ะ','ex','%'],['สกอร์จริงอยู่ใน Top-3','t3','%'],['สูง/ต่ำ 2.5 ถูก','ou','%'],['ทั้งคู่ได้ประตู (BTTS) ถูก','bt','%'],['คลาดเคลื่อนประตูรวม (น้อย=ดี)','mae',' ประตู'],['คะแนน log ของสกอร์จริง (ใกล้ 0 = ดี)','ll','']];
 let o=`<h2>ความแม่น</h2><div class="c"><b>ทดสอบเดินหน้า ${B.n} นัด</b><div class="m">ฝึกด้วยข้อมูลก่อนแต่ละช่วงแล้วทายช่วงนั้น ไม่แอบดูเฉลย (ยังไม่รวมราคาเจ้ามือ)<br>ตัวเลือกของระบบถูกเลือกจากชุดทดสอบนี้เอง ตัวเลขจึงอาจดูดีเกินจริงเล็กน้อย ผลทายจริงด้านล่างเชื่อถือได้กว่าเมื่อสะสมครบ 40 นัด</div>
 <div style="overflow-x:auto"><table><tr><th style="text-align:left">ตัวชี้วัด</th><th>ค่าเฉลี่ยลีก</th><th>Poisson</th><th>โมเดลเต็ม</th></tr>${rows.map(r=>`<tr><td style="text-align:left">${r[0]}</td>${['base','po','full'].map(k=>`<td>${T[k][r[1]]}${r[2]}</td>`).join('')}</tr>`).join('')}</table></div>
 <div class="m" style="margin-top:8px">"ค่าเฉลี่ยลีก" คือโมเดลเปล่าที่ไม่รู้จักทีมเลย ใช้เป็นเส้นฐานว่าความรู้เรื่องทีมช่วยได้แค่ไหน</div></div>${blendBox()}${setBox()}<div class="c"><b>ผลทายจริงของแอปนี้</b>`;
 if(!a.n)o+='<div class="m">ยังไม่มีแมตช์ที่ทายแล้วแข่งจบ</div>';else o+=`<div class="k"><span>ตรวจแล้ว</span><b>${a.n} นัด</b></div><div class="k"><span>ผลถูก (สถิติล้วน)</span><b>${Math.round(a.b/a.n*100)}%</b></div>${a.ni?`<div class="k"><span>ผลถูก (รวมตัวเจ็บ ${a.ni} นัด)</span><b>${Math.round(a.i/a.ni*100)}%</b></div>`:''}<div class="k"><span>สกอร์เป๊ะ</span><b>${Math.round(a.eb/a.n*100)}%</b></div>${a.nt?`<div class="k"><span>สกอร์อยู่ใน Top-3 (${a.nt} นัด)</span><b>${Math.round(a.t3/a.nt*100)}%</b></div>`:''}`;
 return o+'</div>'+D.hist.map(h=>`<div class="c"><div class="m">${h.d}</div><div class="row"><div class="tm">${badge(h.h)}<span>${nm(h.h)}</span></div><div class="sc">${h.x} - ${h.y}</div><div class="tm r">${badge(h.a)}<span>${nm(h.a)}</span></div></div><div class="m" style="margin-top:8px">ทาย: ${pt[h.pb]} (สกอร์ ${h.b[0]}-${h.b[1]}) ${h.okb?'✅':'❌'}${h.h3===true?' · สกอร์อยู่ใน Top-3 ✅':''}${h.pi?` · รวมตัวเจ็บ: ${pt[h.pi]} ${h.oki?'✅':'❌'}`:''} · ผลจริง: ${pt[h.r]}</div></div>`).join('')}
function right(){const a=D.acc,u=D.updated_at.split(' ');const d=new Date(u[0]+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
 return`<div class="c"><b>🏆 อันดับคะแนน</b>${tbl(5)}<button class="pill" style="cursor:pointer;margin-top:8px" onclick="go('tb')">ดูทั้งหมด ›</button></div>
 <div class="c"><b>🎯 ความแม่นของระบบ</b><div class="k"><span>ทดสอบเดินหน้า ผลถูก</span><b>${BM().acc}%</b></div><div class="k"><span>สกอร์ใน Top-3</span><b>${BM().t3}%</b></div><div class="k"><span>ทายจริงถูก</span><b>${a.n?a.b+' / '+a.n:'รอผล'}</b></div><button class="pill" style="cursor:pointer;margin-top:8px" onclick="go('acc')">รายละเอียด ›</button></div>
 <div class="c"><b>🕒 อัปเดตล่าสุด</b><div style="font-size:18px;margin:6px 0">${d} ${u[1]} น.</div><div class="m">เวลาไทย · อัปเดตอัตโนมัติทุกวัน ~10:00 และวันพฤหัส/ศุกร์ ~16:00 (อาจเลื่อนได้ราว 10-30 นาที)</div></div>`}
const TABS={home:['🏠','หน้าแรก',home],fx:['📅','โปรแกรม',fxTab],tb:['🏆','อันดับ',()=>`<h2>อันดับคะแนน</h2><div class="c" style="overflow-x:auto">${tbl(0)}</div>`],acc:['🎯','ความแม่น',accTab]};
function go(t){tab=t;render();scrollTo(0,0)}
function render(){const nv=Object.entries(TABS).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v[0]} ${v[1]}</button>`).join('');
 $('#side').innerHTML='<div class="brand">⚽ EPL ทายสกอร์<small>ทายล่วงหน้าวีคต่อวีค</small></div>'+nv;$('#bnav').innerHTML=nv;$('#main').innerHTML=TABS[tab][2]();$('#right').innerHTML=right()}
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;render()}).catch(e=>$('#main').innerHTML='โหลดข้อมูลไม่สำเร็จ: '+e);
</script></body></html>
